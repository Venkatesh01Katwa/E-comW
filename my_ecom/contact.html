<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact | E-Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="main-content no-sidebar">
    <!-- Navbar -->
    <header class="site-header">
      <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="nav-left"><div class="logo">E-Shop</div></div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Open menu">☰</button>
      </nav>
    </header>

    <!-- Page Hero -->
    <section class="page-hero contact-hero">
      <h1>Contact Us</h1>
      <p>Have questions? We'd love to hear from you. Reach out through the form or details below.</p>
    </section>

    <!-- Contact Section -->
    <main>
      <section class="contact page-pad">
        <div class="contact-container">
          <!-- Form -->
          <div class="contact-form">
            <h2>Send Us a Message</h2>
            <form>
              <label for="name">Name</label>
              <input id="name" type="text" placeholder="Your Name" required>

              <label for="email">Email</label>
              <input id="email" type="email" placeholder="Your Email" required>

              <label for="message">Message</label>
              <textarea id="message" placeholder="Your Message" required></textarea>

              <button type="submit" class="btn primary">Send Message</button>
            </form>
          </div>

          <!-- Contact Info -->
          <div class="contact-info">
            <div class="info-card">
              <h3>Our Office</h3>
              <p>123 Market Street,<br> Bangalore, India</p>
            </div>
            <div class="info-card">
              <h3>Email</h3>
              <p><a href="mailto:support@eshop.com">support@eshop.com</a></p>
            </div>
            <div class="info-card">
              <h3>Phone</h3>
              <p>+91 98765 43210</p>
            </div>

           
            <!-- Google Map -->
            <div class="map-container">
              <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3890.1524549288206!2d77.594562!3d12.9715987!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae1670d3d8e8f1%3A0x3b1a54b9f3c8470!2sMG%20Road%2C%20Bangalore!5e0!3m2!1sen!2sin!4v1632997898754!5m2!1sen!2sin" 
                width="100%" 
                height="250" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
              </iframe>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer-inner">
        <p>© 2025 E-Shop • Built with care</p>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
