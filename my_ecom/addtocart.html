<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | E-Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main-content no-sidebar">
    <header class="site-header">
      <nav class="navbar">
        <div class="nav-left">
          <div class="logo">E-Shop</div>
        </div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="page-pad">
      <h2>Your Cart 🛒</h2>
      <div id="cartContainer" class="cart-container"></div>
      <div id="cartTotal" class="cart-total"></div>
      <div style="margin-top:20px;">
        <button class="btn primary" onclick="proceedToCheckout()">Proceed to Checkout</button>
      </div>
    </main>

    <footer>
      <div class="footer-inner">
        <p>© 2025 E-Shop • Smart Cart System</p>
      </div>
    </footer>
  </div>

  <script>
    function renderCart() {
      const container = document.getElementById("cartContainer");
      const totalDiv = document.getElementById("cartTotal");
      let cart = JSON.parse(localStorage.getItem("cartItems")) || [];

      if (cart.length === 0) {
        container.innerHTML = "<p>Your cart is empty.</p>";
        totalDiv.innerHTML = "";
        return;
      }

      container.innerHTML = cart.map((item, i) => `
        <div class="cart-item">
          <img src="${item.img}" alt="${item.title}">
          <div class="cart-details">
            <h3>${item.title}</h3>
            <p>${item.price}</p>
            <div class="qty-controls">
              <button onclick="changeQty(${i}, -1)">-</button>
              <span>${item.qty}</span>
              <button onclick="changeQty(${i}, 1)">+</button>
            </div>
            <button class="btn outline" onclick="removeItem(${i})">Remove</button>
          </div>
        </div>
      `).join("");

      const total = cart.reduce((sum, i) => sum + i.qty * parseFloat(i.price.replace(/[^0-9.]/g, "")), 0);
      totalDiv.innerHTML = `<h3>Total: $${total.toFixed(2)}</h3>`;
    }

    function changeQty(index, delta) {
      let cart = JSON.parse(localStorage.getItem("cartItems")) || [];
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      localStorage.setItem("cartItems", JSON.stringify(cart));
      renderCart();
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem("cartItems")) || [];
      cart.splice(index, 1);
      localStorage.setItem("cartItems", JSON.stringify(cart));
      renderCart();
    }

    document.addEventListener("DOMContentLoaded", renderCart);

    function proceedToCheckout() {
  const cart = JSON.parse(localStorage.getItem("cartItems")) || [];
  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  // Save full cart as checkout data
  localStorage.setItem("checkoutCart", JSON.stringify(cart));

  // Go to checkout page
  window.location.href = "checkout.html";
}

  </script>

  <style>
    .cart-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
    }
    .cart-item {
      display: flex;
      gap: 20px;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .cart-item img {
      width: 120px;
      border-radius: 8px;
    }
    .cart-details h3 { margin-bottom: 5px; }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }
    .qty-controls button {
      background: #ff6600;
      border: none;
      color: white;
      font-size: 16px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
    }
    .qty-controls button:hover {
      background: #e65c00;
    }
    .cart-total {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: 700;
    }
  </style>
</body>
</html>
